# Runs the application without an Entra tenant, against the mock issuer in compose.yaml.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/entra
          audiences: catalog-api

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s

catalog:
  security:
    scope: api://catalog-api/access_as_user
    authorization-url: http://localhost:8081/entra/authorize
    token-url: http://localhost:8081/entra/token

springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-local
