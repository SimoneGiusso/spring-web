spring:
  application:
    name: spring-web

  datasource:
    url: jdbc:postgresql://localhost:5432/catalog
    username: catalog
    password: catalog

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  web:
    error:
      include-message: never
      include-stacktrace: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
          audiences: ${ENTRA_API_CLIENT_ID}
          authorities-claim-name: roles
          authority-prefix: ""
          principal-claim-name: oid

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.simonegiusso.springweb: INFO
