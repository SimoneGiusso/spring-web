spring:
  application:
    name: spring-web

  datasource:
    url: jdbc:postgresql://localhost:5432/catalog
    username: catalog
    password: catalog

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB

  web:
    error:
      include-message: never
      include-stacktrace: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
          audiences: ${ENTRA_API_CLIENT_ID}
          authorities-claim-name: roles
          authority-prefix: ""
          principal-claim-name: oid

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.simonegiusso.springweb: INFO

catalog:
  security:
    required-scope: ${ENTRA_REQUIRED_SCOPE:access_as_user}
    scope: ${ENTRA_SCOPE:api://${ENTRA_API_CLIENT_ID}/${catalog.security.required-scope}}
    authorization-url: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/authorize
    token-url: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token

springdoc:
  swagger-ui:
    oauth:
      client-id: ${ENTRA_SWAGGER_CLIENT_ID}
      use-pkce-with-authorization-code-grant: true
      scopes:
        - openid
        - ${catalog.security.scope}
