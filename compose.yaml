services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U catalog -d catalog" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interactive local issuer: log in as alice, bob, reader or auditor.
  mock-entra:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8081:8080"
    environment:
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "entra",
              "requestMappings": [
                {
                  "requestParam": "subject",
                  "match": "alice",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "alice",
                    "oid": "alice",
                    "scp": "access_as_user",
                    "roles": [
                      "Catalog.ReadWrite"
                    ]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "bob",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "bob",
                    "oid": "bob",
                    "scp": "access_as_user",
                    "roles": [
                      "Catalog.ReadWrite"
                    ]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "reader",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "reader",
                    "oid": "reader",
                    "scp": "access_as_user",
                    "roles": [
                      "Catalog.Read"
                    ]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "auditor",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "auditor",
                    "oid": "auditor",
                    "scp": "access_as_user",
                    "roles": [
                      "Catalog.Read.All"
                    ]
                  }
                }
              ]
            }
          ]
        }

  lgtm:
    image: grafana/otel-lgtm:0.32.1
    labels:
      org.springframework.boot.ignore: "true" # Explicitly configures connection with application properties and not via pring-boot-docker-compose
    ports:
      - "3000:3000"   # Grafana
      - "4318:4318"   # OTLP/HTTP — the endpoint application-local.yml points at
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # allow unauthenticated access
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # give those visitors Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true" # hide the login form entirely
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 30
