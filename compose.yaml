services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U catalog -d catalog" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Entra ID so the application can be run without a tenant. It is a real OIDC
  # issuer — discovery, JWKS, signatures — issuing tokens shaped like Entra's: the client id
  # becomes the `oid`, and so the tenant. Ask for client_id=auditor to get Catalog.Read.All.
  mock-entra:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8081:8080"
    environment:
      JSON_CONFIG: >
        {
          "tokenCallbacks": [
            {
              "issuerId": "entra",
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "alice",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "alice",
                    "oid": "alice",
                    "idtyp": "app",
                    "roles": [
                      "Catalog.ReadWrite"
                    ]
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "bob",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "bob",
                    "oid": "bob",
                    "idtyp": "app",
                    "roles": [
                      "Catalog.ReadWrite"
                    ]
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "reader",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "reader",
                    "oid": "reader",
                    "idtyp": "app",
                    "roles": [
                      "Catalog.Read"
                    ]
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "auditor",
                  "claims": {
                    "aud": "catalog-api",
                    "sub": "auditor",
                    "oid": "auditor",
                    "idtyp": "app",
                    "roles": [
                      "Catalog.Read.All"
                    ]
                  }
                }
              ]
            }
          ]
        }
